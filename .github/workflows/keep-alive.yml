name: Keep Render and Supabase Alive

on:
  workflow_dispatch:

  schedule:
    - cron: '3,13,23,33,43,53 * * * *'

jobs:
  keep-alive:
    runs-on: ubuntu-latest

    steps:
      - name: Call backend database health endpoint
        run: |
          curl --retry 3 \
            --retry-delay 10 \
            --retry-all-errors \
            --fail \
            --silent \
            --show-error \
            --max-time 120 \
            "${{ secrets.RENDER_HEALTH_DB_URL }}"
